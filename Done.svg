<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"></stop>
      <stop offset="100%" stop-color="#7c4dff"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <clipPath id="textClip">
      <rect x="150" y="45" width="600" height="85"></rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="180" rx="28" fill="#0d1117"></rect>

  <!-- Neon Border -->
  <rect x="4" y="4" width="892" height="172" rx="24" fill="none" stroke="url(#gradient)" stroke-width="3" filter="url(#glow)"></rect>

  <!-- Animated Text -->
  <g clip-path="url(#textClip)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="url(#gradient)" filter="url(#glow)">

    <!-- Network Engineer -->
    <text x="450" y="108">
      Network Engineer
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -90;0 -90;0 0" keyTimes="0;0.35;0.45;0.85;1" dur="6s" repeatCount="indefinite"></animateTransform>
    </text>

    <!-- Vibe_Coder -->
    <text x="450" y="198">
      Vibe_Coder
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -90;0 -90;0 0" keyTimes="0;0.35;0.45;0.85;1" dur="6s" repeatCount="indefinite"></animateTransform>
    </text>

  </g>

  <!-- Moving Neon Particle -->
  <circle r="5" fill="#00e5ff" filter="url(#glow)">
    <animate attributeName="cx" values="70;830;70" dur="5s" repeatCount="indefinite"></animate>

    <animate attributeName="cy" values="145;35;145" dur="5s" repeatCount="indefinite"></animate>
  </circle>

</svg>