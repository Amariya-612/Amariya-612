<svg width="900" height="80" viewBox="0 0 900 80"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>

      <animate
        attributeName="x1"
        values="0%;100%;0%"
        dur="4s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="100%;0%;100%"
        dur="4s"
        repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Network Engineer -->
  <text
    x="-300"
    y="50"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="700"
    fill="url(#gradient)"
    filter="url(#glow)">
    Network Engineer

    <animate
      attributeName="x"
      values="-300;350;350;-300"
      keyTimes="0;0.35;0.65;1"
      dur="6s"
      repeatCount="indefinite"/>
  </text>

  <!-- Front-End Developer -->
  <text
    x="900"
    y="50"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="700"
    fill="url(#gradient)"
    filter="url(#glow)">
    Front-End Developer

    <animate
      attributeName="x"
      values="900;350;350;900"
      keyTimes="0;0.35;0.65;1"
      dur="6s"
      repeatCount="indefinite"/>
  </text>

</svg>
